<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIST TAROT_DECODER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpg" href="favicon.jpg">
</head>
<body>
      <nav>
        <!-- A simple back button to return to your main terminal -->
        <p><a href="index.html">< [ BACK TO HOME ]</a></p>
      </nav>
    <main id="oracle-box">
        <h1>FILE: TAROT</h1>
        
        <p id="status">[ WASM C++ ENGINE: ACTIVE ]</p>
        
        <div class="manifesto">
            <p>THINKING FOR YOURSELF IS SO 2000</p>
        </div>

        <div class="input-group">
            <input type="text" id="question" placeholder="ASK A YES/NO/MAYBE QUESTION..." autocomplete="off">
            <button id="consult-btn">CONSULT TAROT</button>
        </div>

        <div id="output">
            <!-- WASM Output will stream here -->
        </div>
    </main>

    <script>
        var Module = {
            print: function(text) {
                const output = document.getElementById('output');
                output.innerText += text + '\n';
                output.scrollTop = output.scrollHeight; // Auto-scrolls to bottom
            },
            printErr: function(text) {
                document.getElementById('output').innerHTML += `<span style="color: #ff4444;">[ERR] ${text}</span>\n`;
            }
        };
    </script>
    <script src="tarot_engine.js"></script>
    <script>
        document.getElementById('consult-btn').addEventListener('click', () => {
            const question = document.getElementById('question').value;
            const outputBox = document.getElementById('output');

            if (!question.trim()) {
                outputBox.innerText += "[!] ERROR: NO QUESTION DETECTED.\n";
                return;
            }

            outputBox.innerText += `\n> QUERY: ${question.toUpperCase()}\n> WAITING FOR NIST ENTROPY...\n`;
            Module._consult_oracle();
        });
    </script>
</body>
</html>
